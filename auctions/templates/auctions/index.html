{% extends "auctions/layout.html" %}
{% load static %}
{% block body %}
    <h2>Active Listings</h2>
 
<div class="container-fluid px-5 my-4">

  <div class="row">
    {% for item in listings %}

    <div class="col-12 col-md-6 col-lg-4 mb-4">
      <a href="{% url 'items' item.id %}" class="card listing-card h-100 text-decoration-none  {% if item.closed %}disabled{% endif %}">
          <img src="{% static 'uploads/'|add:item.photo.url %}" alt="{{ item.listing }}" class="listing-photo">
        <div class="card-body" >
          <h2 class="card-title">{{ item.listing }}</h2>
          <p class="card-text">{{ item.description }}</p>
          <p class="card-text font-weight-bold">Price: ${{ item.starting_bid }}</p>
          <p class="card-text">created {{ item.creation }}</p>
        </div>

      </a>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
